services:
  app:
    # The published, attested image. `pull` moves to the newest one; `up` uses what is
    # present, otherwise pulls. This file never builds: a source build would occupy this
    # name with unattested bytes, so it lives in docker-compose.build.yml under a local tag.
    # Source installs add docker-compose.build.yml to the COMPOSE_FILE chain in .env (other overlays
    # may sit beside it); Compose reads it before every command. An explicit -f list replaces it
    # outright, so never mix the two.
    # To run only what CI attested, pin the commit you chose by digest and verify it first (gh
    # logged in). Tags are movable, :<commit sha> included, so the digest comes from the tag but
    # the guarantee comes from the attestation: it must verify against this workflow on master
    # AND record your commit as its source, or the chain stops. The new .env is staged in this
    # directory and renamed atomically over the old one only if the filtered copy was written
    # in full, so a failed check, an unreadable .env or a short write never replaces your
    # secrets. Re-run with a newer sha to move; delete the KYPULSE_IMAGE line to follow :latest
    # again. A source install is unaffected: the build overlay's image wins over this pin.
    #   sha=<full commit sha you intend to run, e.g. $(git rev-parse origin/master)>
    #   d=$(docker buildx imagetools inspect ghcr.io/busnes-app/kypulse-server:$sha --format '{{.Manifest.Digest}}') \
    #     && gh attestation verify "oci://ghcr.io/busnes-app/kypulse-server@$d" --repo Busnes-app/KyPulse-server \
    #          --cert-identity https://github.com/Busnes-app/KyPulse-server/.github/workflows/ci.yml@refs/heads/master \
    #     && [ "$(gh attestation verify "oci://ghcr.io/busnes-app/kypulse-server@$d" --repo Busnes-app/KyPulse-server \
    #          --cert-identity https://github.com/Busnes-app/KyPulse-server/.github/workflows/ci.yml@refs/heads/master \
    #          --format json --jq '.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit')" = "$sha" ] \
    #     && (umask 077; t=$(mktemp ./.env.XXXXXX) && touch .env && { grep -v '^KYPULSE_IMAGE=' .env || [ $? -eq 1 ]; } > "$t" \
    #         && echo "KYPULSE_IMAGE=ghcr.io/busnes-app/kypulse-server@$d" >> "$t" && mv "$t" .env) \
    #     && grep -qxF "KYPULSE_IMAGE=ghcr.io/busnes-app/kypulse-server@$d" .env
    # To pin a release instead, verify its version tag, never :stable (it moves; resolve the
    # version it should be): the attestation must come from release-image.yml at that tag and
    # record the commit the tag points to.
    #   v=<release version you intend to run, e.g. 0.4.2>
    #   sha=$(gh api repos/Busnes-app/KyPulse-server/commits/refs/tags/v$v --jq .sha) \
    #     && d=$(docker buildx imagetools inspect ghcr.io/busnes-app/kypulse-server:$v --format '{{.Manifest.Digest}}') \
    #     && gh attestation verify "oci://ghcr.io/busnes-app/kypulse-server@$d" --repo Busnes-app/KyPulse-server \
    #          --cert-identity https://github.com/Busnes-app/KyPulse-server/.github/workflows/release-image.yml@refs/tags/v$v \
    #     && [ "$(gh attestation verify "oci://ghcr.io/busnes-app/kypulse-server@$d" --repo Busnes-app/KyPulse-server \
    #          --cert-identity https://github.com/Busnes-app/KyPulse-server/.github/workflows/release-image.yml@refs/tags/v$v \
    #          --format json --jq '.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit')" = "$sha" ] \
    #     && (umask 077; t=$(mktemp ./.env.XXXXXX) && touch .env && { grep -v '^KYPULSE_IMAGE=' .env || [ $? -eq 1 ]; } > "$t" \
    #         && echo "KYPULSE_IMAGE=ghcr.io/busnes-app/kypulse-server@$d" >> "$t" && mv "$t" .env) \
    #     && grep -qxF "KYPULSE_IMAGE=ghcr.io/busnes-app/kypulse-server@$d" .env
    image: ${KYPULSE_IMAGE:-ghcr.io/busnes-app/kypulse-server:latest}
    pull_policy: missing
    container_name: kypulse
    restart: unless-stopped
    # Covers cmd/server's shutdownTimeout (5s HTTP drain) plus backupWaitTimeout (17m for a
    # deposit already on the wire), so SIGKILL cannot land on a capsule mid-upload.
    stop_grace_period: 20m
    # Runs as uid 10001 (the image's USER) on a read-only root filesystem with no capabilities.
    # ./data, ./backups and ./secrets must be owned by 10001 (README, Quick start).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Loopback only by default; a TLS proxy on this host reaches it. KYPULSE_BIND=0.0.0.0 in
    # .env publishes it on every interface (the behaviour before this default).
    ports:
      - "${KYPULSE_BIND:-127.0.0.1}:8080:8080"
    environment:
      - KYPULSE_ENV=production
      - KYPULSE_PORT=8080
      - KYPULSE_HOST=0.0.0.0
      - KYPULSE_APP_NAME=kyPulse
      # The address users open. Session cookies are Secure, so a browser on another machine
      # needs https here (behind a TLS proxy); only http://localhost works without it.
      - KYPULSE_APP_URL=${KYPULSE_APP_URL:-http://localhost:8080}
      - KYPULSE_DB_DRIVER=sqlite
      - KYPULSE_DATA_DIR=/app/data
      # The audit key lives apart from the database, so write access to ./data alone cannot
      # re-sign the audit chain. An existing data/audit.key is still used until it is moved
      # here (README, Audit key).
      - KYPULSE_AUDIT_KEY_FILE=/app/secrets/audit.key
      # Disaster recovery. Sealed capsules land in KYPULSE_BACKUP_DIR (empty = no local copies);
      # the schedule below is only the default the admin screen overrides. KYPULSE_DNS lives in
      # docker-compose.lan-dns.yml, never here.
      - KYPULSE_BACKUP_DIR=${KYPULSE_BACKUP_DIR-/app/backups}
      - KYPULSE_BACKUP_KEEP=${KYPULSE_BACKUP_KEEP:-7}
      - KYPULSE_BACKUP_DEPOSIT_INTERVAL=${KYPULSE_BACKUP_DEPOSIT_INTERVAL:-24h}
      - KYPULSE_BACKUP_ALLOW_PRIVATE_RECOVERY=${KYPULSE_BACKUP_ALLOW_PRIVATE_RECOVERY:-false}
      # Alerts. The webhook itself is set in the UI and stored sealed; this admits a
      # plain-http webhook URL to any host; loopback and link-local stay refused.
      - KYPULSE_ALERT_ALLOW_HTTP=${KYPULSE_ALERT_ALLOW_HTTP:-false}
      # Concurrent health polls (1..32).
      - KYPULSE_POLL_WORKERS=${KYPULSE_POLL_WORKERS:-4}
      # Set in .env to the reverse proxy's own address when one fronts this service, e.g.
      # 172.18.0.2/32 (never a whole bridge range like 172.16.0.0/12, which trusts every other
      # container). 0.0.0.0/0 and ::/0 are refused at startup. Empty trusts no proxy.
      - KYPULSE_TRUSTED_PROXIES=${KYPULSE_TRUSTED_PROXIES:-}
      # First-start admin password; empty generates one and logs it. Read only while the
      # database has no users; remove it from .env afterwards.
      - KYPULSE_ADMIN_PASSWORD=${KYPULSE_ADMIN_PASSWORD:-}
      - KYPULSE_SSO_ENABLED=true
      # KyIdentity SSO by environment. Installer setup (docs/INSTALLER_SETUP.md) reads these
      # from files instead and refuses values that differ from its bundle.
      - KYPULSE_KYSIGNON_ISSUER=${KYPULSE_KYSIGNON_ISSUER:-}
      - KYPULSE_KYSIGNON_CLIENT_ID=${KYPULSE_KYSIGNON_CLIENT_ID:-}
      - KYPULSE_KYSIGNON_SECRET=${KYPULSE_KYSIGNON_SECRET:-}
      - KYPULSE_KYSIGNON_HMAC_SECRET=${KYPULSE_KYSIGNON_HMAC_SECRET:-}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./secrets:/app/secrets

  # Optional PostgreSQL service for enterprise heavy DB mode. Reachable only from the app on
  # the compose network, never published. Set POSTGRES_PASSWORD in .env (openssl rand -hex 32);
  # postgres refuses to initialise without one. Then set, in the app's environment:
  #   KYPULSE_DB_DRIVER=postgres
  #   KYPULSE_DB_DSN=postgres://postgres:<POSTGRES_PASSWORD>@postgres:5432/kypulse?sslmode=disable
  # (An unset password cannot be a `:?` error here: Compose interpolates every profile, so it
  # would break the default SQLite install too.)
  postgres:
    image: postgres:17-alpine
    container_name: kypulse_postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: kypulse
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
