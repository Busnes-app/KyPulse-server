# Append this file to COMPOSE_FILE in .env; see README.md, Compose overlays, for setup.
services:
  app:
    networks:
      default:
        ipv4_address: ${KYPULSE_CONTAINER_IP:?Set KYPULSE_CONTAINER_IP in .env}

networks:
  default:
    ipam:
      config:
        - subnet: ${KYPULSE_NETWORK_SUBNET:?Set KYPULSE_NETWORK_SUBNET in .env}
